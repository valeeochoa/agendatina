<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Iniciar Sesión | Agendatina</title>
    <link rel="icon" href="public/logo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="preload" href="assets/css/global.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="assets/css/global.css"></noscript>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Manrope', 'sans-serif'], brand: ['Fredoka', 'sans-serif'] }, 
                    colors: { primary: '#D11149', secondary: '#FC8712' } 
                } 
            }
        }
    </script>
    <style>
        /* Animación Efecto Lava Agendatina */
        .lava-container {
            position: absolute;
            inset: -20%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            filter: blur(75px);
            opacity: 0.85;
        }

        .lava-blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: multiply;
            will-change: transform, border-radius;
        }

        .lava-1 {
            top: 10%;
            left: 15%;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #D11149 0%, #ff4d79 100%);
            animation: lavaMove1 22s ease-in-out infinite alternate;
        }

        .lava-2 {
            bottom: 10%;
            right: 15%;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, #FC8712 0%, #ffaa43 100%);
            animation: lavaMove2 26s ease-in-out infinite alternate;
        }

        .lava-3 {
            top: 40%;
            left: 35%;
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #e6005c 0%, #FC8712 100%);
            animation: lavaMove3 19s ease-in-out infinite alternate;
        }

        .lava-4 {
            bottom: 25%;
            left: 10%;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #ff5e36 0%, #D11149 100%);
            animation: lavaMove4 24s ease-in-out infinite alternate;
        }

        .lava-5 {
            top: 15%;
            right: 20%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #ff922b 0%, #d11149 100%);
            animation: lavaMove5 21s ease-in-out infinite alternate;
        }

        @keyframes lavaMove1 {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
            }
            33% {
                transform: translate(140px, -90px) scale(1.25) rotate(110deg);
                border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%;
            }
            66% {
                transform: translate(-100px, 120px) scale(0.9) rotate(230deg);
                border-radius: 38% 62% 63% 37% / 60% 35% 65% 40%;
            }
            100% {
                transform: translate(60px, 80px) scale(1.1) rotate(360deg);
                border-radius: 55% 45% 30% 70% / 50% 60% 40% 50%;
            }
        }

        @keyframes lavaMove2 {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                border-radius: 60% 40% 30% 70% / 50% 30% 70% 50%;
            }
            33% {
                transform: translate(-130px, 110px) scale(1.2) rotate(-130deg);
                border-radius: 40% 60% 70% 30% / 60% 40% 60% 40%;
            }
            66% {
                transform: translate(120px, -80px) scale(0.85) rotate(-250deg);
                border-radius: 70% 30% 40% 60% / 35% 65% 35% 65%;
            }
            100% {
                transform: translate(-70px, -90px) scale(1.15) rotate(-360deg);
                border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
            }
        }

        @keyframes lavaMove3 {
            0% {
                transform: translate(0px, 0px) scale(0.9) rotate(0deg);
                border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%;
            }
            50% {
                transform: translate(-150px, -130px) scale(1.3) rotate(180deg);
                border-radius: 35% 65% 30% 70% / 65% 35% 65% 35%;
            }
            100% {
                transform: translate(110px, 100px) scale(0.95) rotate(360deg);
                border-radius: 65% 35% 55% 45% / 45% 55% 45% 55%;
            }
        }

        @keyframes lavaMove4 {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                border-radius: 70% 30% 50% 50% / 30% 50% 50% 70%;
            }
            50% {
                transform: translate(130px, -110px) scale(1.25) rotate(-160deg);
                border-radius: 40% 60% 35% 65% / 65% 35% 65% 35%;
            }
            100% {
                transform: translate(-90px, 120px) scale(0.9) rotate(-320deg);
                border-radius: 55% 45% 60% 40% / 40% 60% 40% 60%;
            }
        }

        @keyframes lavaMove5 {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
                border-radius: 40% 60% 45% 55% / 55% 45% 60% 40%;
            }
            50% {
                transform: translate(-110px, 140px) scale(1.2) rotate(140deg);
                border-radius: 65% 35% 60% 40% / 40% 60% 35% 65%;
            }
            100% {
                transform: translate(100px, -100px) scale(0.95) rotate(300deg);
                border-radius: 45% 55% 35% 65% / 50% 50% 60% 40%;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#fff7f5] via-[#fff1eb] to-[#ffecf1] text-slate-900 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
    
    <!-- Fondo Animado Efecto Lava -->
    <div class="lava-container" aria-hidden="true">
        <div class="lava-blob lava-1"></div>
        <div class="lava-blob lava-2"></div>
        <div class="lava-blob lava-3"></div>
        <div class="lava-blob lava-4"></div>
        <div class="lava-blob lava-5"></div>
    </div>

    <!-- Malla sutil para dispersión de luz -->
    <div class="absolute inset-0 bg-white/20 backdrop-blur-[20px] pointer-events-none z-0"></div>

    <div class="bg-white/90 backdrop-blur-xl p-8 sm:p-10 md:p-12 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(209,17,73,0.18)] border border-white/80 max-w-md w-full relative z-10 transition-all duration-300">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2.5 mb-6 hover:opacity-85 transition-opacity">
                <img src="public/logo.png" alt="Agendatina" class="h-10 w-auto drop-shadow-sm">
                <span class="font-brand font-semibold text-3xl tracking-tight text-[#d11149]">Agenda<span class="text-[#fc8712]">tina</span></span>
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold font-display text-slate-900 tracking-tight">Bienvenido de nuevo</h1>
            <p class="text-slate-500 text-sm mt-2">Ingresá tus credenciales para acceder a tu panel.</p>
        </div>

        <form id="loginForm" class="flex flex-col gap-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
                    <input type="email" name="username" required class="w-full bg-slate-50/80 border border-slate-200/90 rounded-2xl pl-11 pr-4 py-3.5 text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-primary/80 focus:border-primary outline-none transition-all shadow-sm" placeholder="tu@email.com">
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-semibold text-slate-700">Contraseña</label>
                    <a href="#" onclick="openForgotModal(event)" class="text-xs text-primary font-semibold hover:underline transition-all">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                    <input type="password" name="password" required class="w-full bg-slate-50/80 border border-slate-200/90 rounded-2xl pl-11 pr-12 py-3.5 text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-primary/80 focus:border-primary outline-none transition-all shadow-sm" placeholder="••••••••">
                    <button type="button" onclick="const input = this.previousElementSibling; if(input.type === 'password') { input.type = 'text'; this.firstElementChild.textContent = 'visibility_off'; } else { input.type = 'password'; this.firstElementChild.textContent = 'visibility'; }" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors flex items-center justify-center p-1" title="Mostrar/Ocultar contraseña">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>
            <div id="loginMessage" class="hidden p-3.5 rounded-xl text-sm font-medium bg-red-50 border border-red-200 text-red-700 text-center" role="alert" aria-live="assertive"></div>
            <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-primary to-secondary hover:from-[#b90d3e] hover:to-[#e5780d] text-white py-3.5 rounded-2xl font-bold text-lg mt-2 shadow-lg shadow-primary/25 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                <span>Ingresar al sistema</span>
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </button>
        </form>
    </div>

    <!-- Modal Recuperar Contraseña -->
    <div id="forgotModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/80 max-w-sm w-full p-7 sm:p-8 transform scale-95 transition-transform duration-300" id="forgotModalContent">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold font-display text-slate-900">Recuperar Acceso</h2>
                <button onclick="closeForgotModal()" class="text-slate-400 hover:text-red-500 transition-colors p-1 flex items-center justify-center rounded-lg hover:bg-slate-100"><span class="material-symbols-outlined">close</span></button>
            </div>
            <p class="text-sm text-slate-500 mb-6 leading-relaxed">Ingresá tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.</p>
            <form id="forgotForm" class="flex flex-col gap-4">
                <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="tu@email.com">
                <div id="forgotMessage" class="hidden p-3 rounded-lg text-sm font-medium text-center" role="alert" aria-live="assertive"></div>
                <button type="submit" id="btnForgotSubmit" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-xl transition-all shadow-md shadow-primary/20">Enviar enlace</button>
            </form>
        </div>
    </div>

    <script src="assets/js/script.js?v=1.0.6" defer></script>
    <script src="assets/js/auth.js?v=1.0.6" defer></script>
</body>
</html>
