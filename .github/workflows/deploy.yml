name: Deploy via FTP

on:
  push:
    branches:
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  web-deploy:
    name: Deploy to Ferozo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que compare el commit actual con el anterior

      - name: Sincronizar solo cambios por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          security-options: '{"rejectUnauthorized": false}'
          log-level: verbose
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git**
            **/.github**
            **/node_modules/**
            .env
            .env.example
            implementation_plan.md
            temp_zip/**
            actualizacion.zip