name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Ferozo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar solo cambios por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          security-options: '{"rejectUnauthorized": false}'
          timeout: 60000
          log-level: verbose
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git**
            **/.github**
            **/node_modules/**
            .env
            .env.example
            implementation_plan.md
            walkthrough.md
            temp_zip/**
            actualizacion*.zip
            backend/conexion.php
            backend/admin_auth.php